name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sa
          POSTGRES_PASSWORD: Pa55w0rd
          POSTGRES_DB: myfinanceplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sa -d myfinanceplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Migrations are checked on their own database; the tests drop and recreate every table in theirs.
      DATABASE_URL: postgresql://sa:Pa55w0rd@localhost:5432/myfinanceplace_migrations
      TEST_DATABASE_URL: postgresql://sa:Pa55w0rd@localhost:5432/myfinanceplace_test
      SECRET_KEY: ci-only-not-secret
      PGPASSWORD: Pa55w0rd

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check app tests migrations

      - name: Migrations apply on a fresh database and match the models
        run: |
          createdb -h localhost -U sa myfinanceplace_migrations
          flask --app run db upgrade
          flask --app run db check

      - name: Tests
        run: pytest -q
